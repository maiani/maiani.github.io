name: HTML Proofer

on:
  push:
    branches:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  proof-html:
    runs-on: ubuntu-latest
    steps:
    # checkout to the commit that has been pushed
    - uses: actions/checkout@v6
      with:
        submodules: true  # Fetch Hugo themes (true OR recursive)
        fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

    # Fetch the Toha fork into ../toha so the `replace` directive in go.mod
    # resolves. This lets the site ship theme features ahead of an upstream
    # release. `site` is the fork's integration branch: each fix/feature branch
    # (off upstream main) is merged into it. Remove this step (and the replace)
    # to build against upstream.
    - name: Fetch Toha fork
      run: git clone --depth 1 --branch site https://github.com/maiani/toha.git ../toha

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: 'latest'
        extended: true

    - name: Update Hugo Modules
      run: hugo mod tidy

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install node modules
      run: |
        hugo mod npm pack
        npm ci

    - name: Build
      run: hugo --minify

    # Run HTML Proofer: validate the HTML/CSS and check every link in the built
    # site, including links that come from data files (publications, talks).
    - uses: anishathalye/proof-html@v2.1.4
      with:
        directory: ./public
        enforce_https: false
        # <a> without href is valid HTML5 (a placeholder link, e.g. a card
        # title whose data has no URL).
        allow_missing_href: true
        # Check links to this site against the fresh build, not the live site,
        # which still serves the previous deploy while this runs.
        swap_urls: |
          {"^https:\\/\\/www\\.andreamaiani\\.com\\/": "/"}
        # These answer automated checkers with 403/405/999 although the links work.
        ignore_url_re: |
          ^https://doi\.org/
          ^https://scholar\.google\.com/
          ^https://www\.nyu\.edu
          ^https://www\.linkedin\.com/
